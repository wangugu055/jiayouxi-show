<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0908">
<title>甲有喜 · 一台好戏</title>
<!-- build: v1.6-lazy-fix / 2026-11 · 纯视觉精修：金箔标题/立体按钮/进度圆点/卡片质感，不改逻辑 -->
<style>
:root{
  --gold:#E8C07A; --gold-dim:rgba(232,192,122,.28);
  --wine:#7A1F18; --red:var(--wine); --red-d:#541610; --gold-l:#F2D49E;
  --ink:#14100E; --cream:#F7EEE2; --paper:#F7EEE2; --muted:#9C8B7A;
  --r-pill:999px; --r-card:20px; --r-img:14px;
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-5:48px;
  --f-label:13px; --f-body:15px; --f-lead:20px; --f-name:34px; --f-title:48px;
  --dur:.22s;
  --song:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong",SimSun,"宋体",serif;
  --kai:"Kaiti SC","STKaiti",KaiTi,"楷体",serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#070505;
  /* 防止玩游戏时的下拉/上拉手势触发浏览器"下拉刷新"导致页面自动重载 */
  overscroll-behavior:none;-webkit-overflow-scrolling:touch;touch-action:none}
body{
  font-family:var(--song);color:var(--cream);position:fixed;inset:0;
  user-select:none;-webkit-user-select:none;
  background:radial-gradient(1200px 900px at 50% 26%,#1d100d 0%,#0a0706 62%,#050404 100%);
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#amb{position:fixed;inset:0;z-index:0;background-repeat:no-repeat;background-position:center center;
  background-size:auto;opacity:0;transition:opacity .6s ease;pointer-events:none}
#amb.on{opacity:1}
#safe{position:absolute;left:0;top:0;width:1086px;height:1448px}
/* 竖屏扩图舞台：画布为 1086×2400，原内容仍使用 1086×1448 坐标系并居中放置 */
#stage.tall #safe{top:476px}
#stage.tall .artw{top:-476px;bottom:-476px}
#stage.tall .bgb{top:-476px;bottom:-476px}
#stage.tall #curtain,#stage.tall #flash{top:-476px;bottom:-476px}
#stage.tall .fart{top:-476px;bottom:-476px}
#stage.tall{height:2400px}
#vp{position:fixed;inset:0;overflow:hidden;z-index:2}
#stage{
  position:absolute;left:50%;top:50%;width:1086px;height:1448px;overflow:hidden;background:#0a0706;
  transform-origin:50% 50%;
  box-shadow:none;
}

/* ---------- 通用 ---------- */
.sc{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .42s ease,visibility 0s .42s}
.sc.on{opacity:1;visibility:visible;transition:opacity .38s ease,visibility 0s 0s}
html.dbghot .hot{outline:2px solid #ff3b30;background:rgba(255,59,48,.18)}
html.noanim .sc{transition:none!important}
html.noanim .card,html.noanim .cf,html.noanim .sc.iris,html.noanim #game{animation:none!important}
@keyframes iris{
  from{clip-path:circle(0px at var(--cx,50%) var(--cy,50%))}
  to{clip-path:circle(1650px at var(--cx,50%) var(--cy,50%))}
}
.sc.iris{animation:iris .85s cubic-bezier(.2,.75,.2,1) both}

.artw{position:absolute;inset:0;overflow:hidden;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.art{width:100%;height:100%;object-fit:cover}
.grad-b{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;
  background:linear-gradient(to top,rgba(8,5,4,.96) 0%,rgba(8,5,4,.72) 34%,rgba(8,5,4,0) 100%)}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 42%,rgba(0,0,0,0) 42%,rgba(0,0,0,.55) 100%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}

/* ---------- 窥幕 ---------- */
.hot{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.hot::after{content:"";position:absolute;inset:-10px;border-radius:inherit;
  border:1px solid rgba(216,176,108,0);transition:.35s}
.hot:hover::after,.hot.pulse::after{border-color:rgba(216,176,108,.42);box-shadow:0 0 34px rgba(216,176,108,.28) inset}
.hot.called::after{border-color:rgba(216,176,108,.5);box-shadow:0 0 40px rgba(216,176,108,.35) inset}
.hot .tick{position:absolute;left:100%;top:50%;transform:translate(-14px,-50%) scale(.4);opacity:0;
  font-family:var(--kai);font-size:26px;letter-spacing:.1em;color:var(--gold-l);white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 20px rgba(242,212,158,.85);
  transition:.4s cubic-bezier(.2,1.6,.4,1)}
.hot.called .tick{opacity:1;transform:translate(8px,-50%) scale(1)}

.callbar{position:absolute;left:0;right:0;bottom:0;padding:0 60px 58px;text-align:center;z-index:6}
.callbar .btn-gold{margin-top:26px}
.pips{display:flex;gap:16px;justify-content:center;align-items:center;margin-bottom:20px}
.pip{width:26px;height:26px;border-radius:50%;border:1px solid rgba(216,176,108,.38);transition:.4s}
.pip.on{border-color:transparent;box-shadow:0 0 0 1px rgba(255,255,255,.25),0 0 22px var(--c);background:var(--c)}
.hint{font-family:var(--kai);font-size:24px;letter-spacing:.22em;color:rgba(247,238,226,.66);
  text-shadow:0 2px 12px #000;transition:.3s}
.hint.lit{color:var(--gold-l)}
.btn-gold{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  height:82px;padding:0 54px;border-radius:999px;
  font-family:var(--song);font-weight:700;font-size:34px;letter-spacing:.34em;color:#2b120c;
  background:linear-gradient(160deg,#F6DDA8,#D8B06C 52%,#B98C46);
  box-shadow:0 10px 34px rgba(216,176,108,.28),inset 0 1px 0 rgba(255,255,255,.6);
  border:1px solid rgba(255,240,210,.55);
  opacity:0;transform:translateY(16px) scale(.94);pointer-events:none;
  transition:.5s cubic-bezier(.2,1.2,.3,1);
}
.btn-gold.show{opacity:1;transform:none;pointer-events:auto}
.btn-gold:active{transform:scale(.97)}

/* ---------- 台前 ---------- */
#spot{position:absolute;width:520px;height:520px;border-radius:50%;pointer-events:none;
  transform:translate(-50%,-50%);mix-blend-mode:screen;opacity:0;
  transition:opacity .4s,left .5s,top .5s;
  background:radial-gradient(circle,rgba(255,226,175,.30) 0%,rgba(255,210,140,.12) 42%,rgba(255,200,120,0) 70%)}
#spot.on{opacity:1}
.hot .plate{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:var(--kai);font-size:22px;letter-spacing:.3em;color:var(--gold-l);opacity:0;
  transition:.35s;white-space:nowrap;padding:4px 12px;border-radius:6px;
  background:rgba(10,7,6,.55);border:1px solid rgba(216,176,108,.35)}
.hot:hover .plate{opacity:1}
.chips{display:flex;gap:14px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:10px;height:66px;padding:0 22px;border-radius:999px;
  background:rgba(14,10,9,.55);border:1px solid rgba(216,176,108,.26);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.3s}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.chip b{font-size:27px;font-weight:600;letter-spacing:.06em}
.chip i{font-family:var(--kai);font-style:normal;font-size:19px;color:rgba(216,176,108,.75)}
.chip:hover,.chip.visited{border-color:rgba(216,176,108,.7);background:rgba(40,22,16,.66)}

/* ---------- 后台：立绘舞台 ---------- */
.bgb{position:absolute;inset:-8%;background-size:cover;background-position:center;
  filter:blur(52px) brightness(.17) saturate(.8);transform:scale(1.06);
  opacity:0;transition:opacity .6s ease,background-image .4s}
.bgb.on{opacity:1}
.bgb::after{content:"";position:absolute;inset:0;
  background:radial-gradient(90% 70% at 50% 55%,rgba(8,5,4,.15),rgba(8,5,4,.86) 100%),
             linear-gradient(180deg,rgba(7,5,4,.92),rgba(7,5,4,.35) 30%,rgba(7,5,4,.2) 60%,rgba(7,5,4,.9))}

.bhead{position:absolute;left:60px;top:130px;z-index:9}
.kicker{font-family:var(--kai);font-size:22px;letter-spacing:.42em;color:rgba(216,176,108,.8)}
.bhead h2{font-size:74px;font-weight:900;letter-spacing:.2em;line-height:1.1;margin-top:12px;
  background:linear-gradient(180deg,#FFF3DC,#D8B06C 70%);-webkit-background-clip:text;background-clip:text;
  color:transparent;filter:drop-shadow(0 4px 16px rgba(0,0,0,.7))}
.ename{font-family:var(--kai);font-size:22px;letter-spacing:.3em;color:rgba(247,238,226,.4);margin-top:6px}

.btn-back{position:absolute;left:44px;top:44px;z-index:20;height:62px;padding:0 26px;border-radius:999px;
  display:flex;align-items:center;gap:10px;font-family:var(--kai);font-size:22px;letter-spacing:.16em;
  color:rgba(247,238,226,.8);background:rgba(14,10,9,.6);border:1px solid rgba(216,176,108,.3);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn-back:active{transform:scale(.97)}

.figstage{position:absolute;inset:0;z-index:4;perspective:1400px;
  transition:opacity .5s ease,transform .5s ease}
.figstage.off{opacity:0;transform:scale(1.05);pointer-events:none}
.cone{position:absolute;left:50%;top:-60px;width:780px;height:1220px;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(255,222,170,.17),rgba(255,210,150,.05) 58%,rgba(255,200,140,0) 100%);
  clip-path:polygon(45.5% 0,54.5% 0,100% 100%,0 100%);filter:blur(22px);mix-blend-mode:screen;
  pointer-events:none;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 22%,#000 70%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0%,#000 22%,#000 70%,transparent 100%)}
.halo{position:absolute;left:50%;bottom:240px;width:900px;height:720px;transform:translateX(-50%);
  pointer-events:none;
  background:radial-gradient(50% 50% at 50% 62%,rgba(255,196,130,.15),rgba(255,180,110,.05) 46%,transparent 70%)}
.plat{position:absolute;left:50%;bottom:302px;width:440px;height:96px;transform:translateX(-50%);
  border-radius:50%;pointer-events:none;
  background:radial-gradient(60% 60% at 50% 42%,rgba(255,226,180,.30),rgba(255,190,120,.07) 62%,rgba(0,0,0,0) 78%);
  box-shadow:inset 0 0 0 1px rgba(216,176,108,.30),0 18px 50px rgba(255,170,100,.10)}
.figwrap{position:absolute;left:50%;bottom:350px;width:720px;height:640px;z-index:2;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transform:translateX(-50%) translate3d(var(--fx,0px),var(--fy,0px),0)
            rotateY(var(--fry,0deg)) rotateX(var(--frx,0deg));
  transform-style:preserve-3d;will-change:transform;
  transition:transform .18s ease-out}
.figshadow{position:absolute;left:50%;bottom:-6px;width:320px;height:48px;transform:translateX(-50%);
  background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.6),transparent 70%);filter:blur(7px);pointer-events:none}
.fig{position:absolute;bottom:0;left:50%;height:var(--fh,460px);width:auto;opacity:0;
  transform:translateX(-50%);transition:opacity .3s ease;
  filter:drop-shadow(0 20px 36px rgba(0,0,0,.68))}
.fig.on{opacity:1}
.fig.pop{animation:pop .4s ease}
@keyframes pop{
  0%{transform:translateX(-50%) scale(1,1)}
  30%{transform:translateX(-50%) scale(1.05,.94)}
  65%{transform:translateX(-50%) scale(.98,1.03)}
  100%{transform:translateX(-50%) scale(1,1)}
}
.fig.jump{animation:figjump .3s ease}
@keyframes figjump{0%{transform:translateX(-50%) translateY(0)}40%{transform:translateX(-50%) translateY(14px) scale(1.03,.96)}100%{transform:translateX(-50%) translateY(0)}}

.vname{position:absolute;right:60px;top:392px;z-index:5;display:flex;gap:20px;writing-mode:vertical-rl;
  text-orientation:upright;pointer-events:none;align-items:flex-start}
.vname .vn{font-family:var(--kai);font-size:46px;letter-spacing:.28em;color:rgba(242,212,158,.92);
  text-shadow:0 0 30px rgba(242,212,158,.35)}
.vname .vr{font-family:var(--kai);font-size:19px;letter-spacing:.34em;color:rgba(216,176,108,.5);margin-top:10px}

.tap-hint{position:absolute;left:50%;bottom:900px;margin-left:160px;z-index:6;
  padding:10px 20px;border-radius:999px;white-space:nowrap;
  font-family:var(--kai);font-size:19px;letter-spacing:.16em;color:rgba(242,212,158,.92);
  background:rgba(12,9,8,.6);border:1px solid rgba(216,176,108,.32);
  pointer-events:none;transition:.45s}
.tap-hint.hide{opacity:0;transform:translateY(8px)}

/* ---------- 后台：剧照 ---------- */
#cardWrap{position:absolute;left:36px;top:336px;width:1014px;height:717px;perspective:1700px;z-index:5;
  opacity:0;transform:translateY(40px) rotateY(-12deg) scale(.94);pointer-events:none;
  transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
#cardWrap.in{opacity:1;transform:none}
#cardTilt{width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.card{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#0a0807;
  box-shadow:0 50px 90px rgba(0,0,0,.75),0 0 0 1px rgba(216,176,108,.22),0 0 80px rgba(255,190,120,.06);
  animation:bob 7.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.card img{width:100%;height:100%;object-fit:cover}
.sheen{position:absolute;inset:0;mix-blend-mode:screen;opacity:.9;pointer-events:none;
  background:radial-gradient(560px 380px at var(--mx,30%) var(--my,20%),rgba(255,236,200,.16),rgba(255,236,200,0) 62%)}

.stamp{position:absolute;left:30px;bottom:28px;width:118px;height:118px;z-index:6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  border-radius:7px;border:5px solid rgba(214,66,50,.9);
  box-shadow:inset 0 0 0 2px rgba(214,66,50,.4),0 8px 22px rgba(0,0,0,.45);
  color:#E4573F;background:rgba(180,40,26,.10);
  font-family:var(--kai);font-size:30px;line-height:1.06;
  opacity:0;transform:rotate(-7deg) scale(2.2);
}
.stamp span{display:block}
.stamp.r{left:auto;right:30px}
.stamp.on{opacity:.92;transform:rotate(-7deg) scale(1);
  animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stampIn{to{opacity:.95;transform:rotate(-8deg) scale(1)}}

.bfoot{position:absolute;left:60px;right:60px;bottom:80px;text-align:center;z-index:9;
  transition:opacity .3s}
.bfoot.off{opacity:0;pointer-events:none}
.quote{font-family:var(--kai);font-size:31px;letter-spacing:.12em;color:rgba(247,238,226,.86);
  text-shadow:0 3px 16px #000;margin-bottom:24px;min-height:44px}
.bfoot .btn-gold{opacity:1;transform:none;pointer-events:auto;height:76px;font-size:29px;
  letter-spacing:.16em;padding:0 44px}
.bfoot .pips{margin:24px 0 0}
.bfoot .pips .pip{width:14px;height:14px}

/* ---------- 后台：小游戏 ---------- */
.ghud{position:absolute;left:0;right:0;bottom:118px;text-align:center;z-index:9;
  opacity:0;transition:.3s;pointer-events:none}
.ghud.on{opacity:1}
.ghud .gh{font-family:var(--kai);font-size:26px;letter-spacing:.14em;color:rgba(247,238,226,.75);
  text-shadow:0 2px 12px #000}
.ghud .gh.bad{color:#e08a6a}
.ghud .gh.good{color:var(--gold-l)}
.gskip{position:absolute;left:50%;bottom:44px;padding:12px 28px;border-radius:999px;pointer-events:none;
  font-family:var(--kai);font-size:22px;letter-spacing:.16em;color:rgba(247,238,226,.55);
  border:1px solid rgba(216,176,108,.28);background:rgba(12,9,8,.5);
  opacity:0;transform:translate(-50%,8px);transition:.35s}
.gskip.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

.glayer{position:absolute;inset:0;z-index:8;pointer-events:none}
.glayer.active{pointer-events:auto}
.tapzone{position:absolute;inset:0}

.finder{position:absolute;width:340px;height:330px;transform:translate(-50%,-50%);pointer-events:none}
.finder i{position:absolute;width:46px;height:46px;border:0 solid rgba(255,238,200,.5)}
.finder .tl{left:0;top:0;border-left-width:3px;border-top-width:3px;border-top-left-radius:8px}
.finder .tr{right:0;top:0;border-right-width:3px;border-top-width:3px;border-top-right-radius:8px}
.finder .bl{left:0;bottom:0;border-left-width:3px;border-bottom-width:3px;border-bottom-left-radius:8px}
.finder .br{right:0;bottom:0;border-right-width:3px;border-bottom-width:3px;border-bottom-right-radius:8px}
.rng{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
#rngT{border:2px dashed rgba(216,176,108,.65)}
#rngL{border:3px solid rgba(255,235,195,.9);box-shadow:0 0 28px rgba(255,205,145,.5),inset 0 0 28px rgba(255,205,145,.2)}

.beat{position:absolute;width:76px;height:76px;margin-left:-38px;margin-top:-38px;border-radius:50%;
  border:1px solid rgba(216,176,108,.32);transition:background .12s,border-color .12s}
.beat.hit{background:linear-gradient(160deg,#F8E2B4,#D8B06C);border-color:transparent;
  box-shadow:0 0 30px rgba(242,212,158,.6)}
.beat.now{border-color:rgba(255,238,200,.95);box-shadow:0 0 26px rgba(242,212,158,.55);
  transform:scale(1.26);transition:transform .1s,border-color .1s,box-shadow .1s}
.beat.miss{border-color:rgba(224,138,106,.5)}
.brng{position:absolute;width:76px;height:76px;margin-left:-38px;margin-top:-38px;border-radius:50%;
  border:2px solid rgba(242,212,158,.85);pointer-events:none;opacity:0;transform-origin:50% 50%}

.cup{position:absolute;left:50%;bottom:304px;width:92px;height:108px;margin-left:86px;
  border-radius:5px 5px 32px 32px;overflow:hidden;
  background:linear-gradient(180deg,#FCF6EA,#E2D3BC);
  box-shadow:0 18px 30px rgba(0,0,0,.55),inset 0 -12px 20px rgba(120,90,60,.25)}
.cup::before{content:"";position:absolute;left:0;right:0;top:0;height:11px;border-radius:50%;
  background:#FFFBF2;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cup .water{position:absolute;left:0;right:0;bottom:0;height:0%;
  background:linear-gradient(180deg,#e8b873,#a8261e 88%)}
.cup .ln{position:absolute;left:0;right:0;border-top:2px dashed rgba(150,46,30,.7);z-index:2}
.qilabel{position:absolute;left:50%;bottom:430px;margin-left:86px;width:92px;text-align:center;
  font-family:var(--kai);font-size:19px;letter-spacing:.1em;color:rgba(242,212,158,.75)}
.stream{position:absolute;left:50%;bottom:412px;width:6px;margin-left:129px;height:0;border-radius:3px;
  background:linear-gradient(180deg,rgba(255,235,200,.85),rgba(255,220,170,.25));opacity:0;
  transition:height .1s linear,opacity .1s}
.stream.on{height:150px;opacity:1}

.chipy{position:absolute;width:74px;height:74px;margin-left:-37px;display:grid;place-items:center;
  animation:chipfall linear forwards}
.chipy i{display:block;width:54px;height:46px;border-radius:52% 48% 46% 54% / 58% 52% 48% 42%;
  background:radial-gradient(70% 70% at 34% 28%,#FFE4A8,#EDB25E 58%,#C4813A);
  box-shadow:inset 0 -3px 6px rgba(120,60,20,.45),inset 0 3px 5px rgba(255,245,210,.55)}
@keyframes chipfall{from{transform:translateY(0) rotate(0)}to{transform:translateY(760px) rotate(200deg)}}


/* ---------- 讨彩头 ---------- */
#scLot{background:radial-gradient(70% 55% at 50% 40%,#2b1812 0%,#0d0806 64%,#060403 100%)}
.testbadge{position:absolute;left:50%;top:28px;transform:translateX(-50%);z-index:11;
  padding:8px 20px;border-radius:999px;font-family:var(--kai);font-size:18px;letter-spacing:.1em;
  color:#ffd9a8;background:rgba(120,30,20,.55);border:1px solid rgba(255,160,120,.45);display:none}
.testbadge.on{display:block}
.lothead{position:absolute;left:0;right:0;top:104px;text-align:center;z-index:6}
.lothead .k{font-family:var(--kai);font-size:21px;letter-spacing:.5em;color:rgba(216,176,108,.85)}
.lothead h2{font-size:86px;font-weight:900;letter-spacing:.2em;margin-top:6px;

var AC=null,ac=null;

/* iOS Safari：在第一次真实用户手势中解锁同一个 AudioContext，后续所有音效复用 */
var audioGestureUnlocked=false;

function noiseBuf(c,dur){
  var n=c.sampleRate*dur,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  return b;
}
function gong(){
  var c=audio(); if(!c) return; var t=c.currentTime;
  var s=c.createBufferSource(); s.buffer=noiseBuf(c,1.6);
  var bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=.7;
  var g=c.createGain(); g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+1.5);
  s.connect(bp); bp.connect(g); g.connect(c.destination); s.start(t);
  var o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(120,t);
  o.frequency.exponentialRampToValueAtTime(52,t+.7);
  var g2=c.createGain(); g2.gain.setValueAtTime(.42,t); g2.gain.exponentialRampToValueAtTime(.001,t+1.2);
  o.connect(g2); g2.connect(c.destination); o.start(t); o.stop(t+1.3);
}
function drum(){
  var c=audio(); if(!c) return; var t=c.currentTime;
  var o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(160,t);
  o.frequency.exponentialRampToValueAtTime(60,t+.16);
  var g=c.createGain(); g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.22);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.24);
}
function clack(){
  var c=audio(); if(!c) return; var t=c.currentTime;
  var s=c.createBufferSource(); s.buffer=noiseBuf(c,.08);
  var f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=2;
  var g=c.createGain(); g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+.09);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
}
function chime(hi){
  var c=audio(); if(!c) return; var t=c.currentTime;
  [880,1320,1760].forEach(function(f,i){
    var o=c.createOscillator(); o.type='sine'; o.frequency.value=f*(hi?1.25:1);
    var g=c.createGain(); g.gain.setValueAtTime(0,t+i*.03);
    g.gain.linearRampToValueAtTime(.12,t+i*.03+.01);
    g.gain.exponentialRampToValueAtTime(.001,t+i*.03+.55);
    o.connect(g); g.connect(c.destination); o.start(t+i*.03); o.stop(t+i*.03+.6);
  });
}

  var c=audio(); if(!c) return; var t=c.currentTime;

  var f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=1800;
  var g=c.createGain(); g.gain.setValueAtTime(.45,t); g.gain.exponentialRampToValueAtTime(.001,t+.07);

function setFig(imgEl,url,cb){
  imgEl.classList.remove('on');
  var show=function(){ cb(); };
  if(imgEl.getAttribute('src')===url && imgEl.complete && imgEl.naturalWidth>0){ show(); return; }
  var done=function(){
    imgEl.removeEventListener('load',done); imgEl.removeEventListener('error',done);
    if(imgEl.getAttribute('src')===url) show();

  imgEl.addEventListener('load',done); imgEl.addEventListener('error',done);
  if(imgEl.getAttribute('src')!==url) imgEl.src=url;
}

  var count=0, done=false, demo=true, beats=$$('.beat',box);
  function figBeat(){ fig.classList.remove('jump'); void fig.offsetWidth; fig.classList.add('jump'); }

  /* 先让傀儡猴自动示范完整四拍，再开放跟拍；保留原定提示文案与四拍通关规则。 */
  function demoStep(i){
    if(done) return;
    beats.forEach(function(b){b.classList.remove('now');});
    if(i>=n){
      demo=false;
      gHint('跟 上 鼓 点 · 点 4 下','good');
      gT(pulse,500);
      return;
    }
    beats[i].classList.add('now');
    figBeat(); drum();
    gT(function(){
      beats[i].classList.remove('now');
      gT(function(){demoStep(i+1);},500);
    },260);
  }

  /* 跟拍阶段：当前节拍持续提示，点击后推进到下一拍。 */
  function pulse(){
    if(done||demo) return;
    var b=beats[count];
    if(b){
      b.classList.add('now');
      gT(function(){b.classList.remove('now');},260);
    }
    drum();
    gT(pulse,760);
  }
  gT(function(){demoStep(0);},300);

  gOn(box,'pointerdown',function(){
    if(done||demo) return;
    var b=beats[count];
    if(!b) return;
    b.classList.remove('now'); b.classList.add('hit');
    count++; chime(); figBeat(); buzz();
    gHint('跟 上 鼓 点 · '+count+' / 4','good');
    if(count>=n){
      done=true;
      gHint('四 下 齐 了','good');
      gT(function(){ winGame(k); },600);
    }
  });
};

Games.tea=function(box,k){
  box.innerHTML='<div class="tapzone"></div>'+
    '<div class="qilabel">七分处</div>'+
    '<div class="cup"><div class="water" id="water"></div>'+
      '<div class="ln" style="bottom:75%"></div></div>'+
    '<div class="stream" id="stream"></div>';
  var water=$('#water'),stream=$('#stream'),fill=0,pour=false,done=false,t0=0;
  function loop(now){
    if(!pour||done){ G.raf=0; return; }   /* 不倒水时不空跑帧，减轻微信 WebView 负担 */
    fill=Math.min(100,(now-t0)/2000*100);
    water.style.height=fill+'%';
    if(fill>=100){pour=false;stream.classList.remove('on');judge();G.raf=0;return;}
    G.raf=requestAnimationFrame(loop);
  }
  function judge(){
    if(done) return;
    if(fill>=68&&fill<=86){done=true;chime(true);winGame(k);}
    else{
      gHint(fill<68?'太浅了 · 再斟':'溢了 · 重来','bad'); clack(); failNow(k);
      gT(function(){fill=0;water.style.height='0%';gHint('按住注水，停在金线里再松手');},700);
    }
  }
  function down(e){
    if(done) return;
    pour=true; t0=performance.now()-fill*20; stream.classList.add('on'); clack();
    if(!G.raf) G.raf=requestAnimationFrame(loop);   /* 按下才开始跑帧 */
    e.preventDefault();
  }
  function up(){ if(!pour||done) return; pour=false; stream.classList.remove('on'); judge(); }
  gOn(box,'pointerdown',down);
  gOn(window,'pointerup',up);
  gOn(window,'pointercancel',up);
  gT(function(){},0);
};

Games.catch=function(box,k){
  box.innerHTML='<div class="tapzone"></div>';
  var need=4,got=0,over=false,spawned=0;
  gHint('0 / 4');
  function spawn(){
    if(over) return;
    spawned++;
    var d=document.createElement('div');
    d.className='chipy';
    d.innerHTML='<i></i>';
    d.style.left=(300+Math.random()*480)+'px';

    d.style.animationDuration=(1500+Math.random()*450)+'ms';
    gOn(d,'animationend',function(){d.remove()});
    gOn(d,'pointerdown',function(e){

      d.remove(); got++; chime();
      gHint(got+' / '+need);

    });
    box.appendChild(d);
    if(spawned<14) gT(spawn,780);
    else gT(function(){ if(!over){gHint('没接够 · 再来一局','bad'); failNow(k);} },1700);
  }

function stickSound(dur){
  var c=audio(); if(!c) return;
  var t0=c.currentTime,span=Math.min(1.2,Math.max(.2,dur||1.2));
  var count=8+Math.floor(Math.random()*4); // 8–11 次即可有竹签碰撞感，减少手机音频节点开销
  for(var i=0;i<count;i++){
    var t=t0+Math.random()*span;
    var s=c.createBufferSource(); s.buffer=noiseBuf(c,.045);
    var f=c.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=900+Math.random()*1900; f.Q.value=2.2+Math.random()*1.4;
    var g=c.createGain(); g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.13+Math.random()*.08,t+.004);
    g.gain.exponentialRampToValueAtTime(.0001,t+.045);
    s.connect(f);f.connect(g);g.connect(c.destination); s.start(t); s.stop(t+.05);
  }
}

function exportCard(stamp){
  var W=880,H=1174,cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  var x=cv.getContext('2d'),img=new Image();
  img.onload=function(){
    var url=null;
    try{
      var sc=Math.max(W/img.width,H/img.height);
      x.drawImage(img,(W-img.width*sc)/2,(H-img.height*sc)/2,img.width*sc,img.height*sc);
      var g=x.createLinearGradient(0,H*.36,0,H);
      g.addColorStop(0,'rgba(6,4,3,0)'); g.addColorStop(.55,'rgba(6,4,3,.72)'); g.addColorStop(1,'rgba(5,3,2,.97)');
      x.fillStyle=g; x.fillRect(0,0,W,H);
      x.textAlign='center';
      x.fillStyle='rgba(216,176,108,.95)'; x.font='22px "Kaiti SC",KaiTi,serif';
      x.fillText('甲 有 喜 · 一 台 好 戏',W/2,H*.60);
      x.fillStyle='#F7EEE2'; x.font='900 92px "Songti SC",SimSun,serif';
      x.fillText('满 堂 彩',W/2,H*.675);
      x.font='26px "Kaiti SC",KaiTi,serif'; x.fillStyle='rgba(247,238,226,.82)';
      x.fillText('散了场，他们才刚开始。',W/2,H*.722);
      var n=ORDER.length,gap=136,sx=W/2-(n-1)*gap/2,sy=H*.795;
      ORDER.forEach(function(k,i){
        var cx=sx+i*gap;
        x.beginPath(); x.arc(cx,sy,47,0,Math.PI*2);
        var rg=x.createLinearGradient(cx-40,sy-40,cx+40,sy+40);
        rg.addColorStop(0,'#F8E2B4'); rg.addColorStop(1,'#D8B06C');
        x.fillStyle=rg; x.fill();
        x.fillStyle='#2b120c'; x.font='28px "Kaiti SC",KaiTi,serif';
        x.fillText(CH[k].name.slice(-1),cx,sy+10);
        x.fillStyle='rgba(247,238,226,.6)'; x.font='18px "Kaiti SC",KaiTi,serif';
        x.fillText(CH[k].name,cx,sy+80);
        if(state.gild[k]){
          x.beginPath(); x.arc(cx,sy,54,0,Math.PI*2);
          x.strokeStyle='rgba(242,212,158,.8)'; x.lineWidth=2; x.stroke();
        }
      });
      x.fillStyle='rgba(247,238,226,.45)'; x.font='17px "Kaiti SC",KaiTi,serif';
      x.fillText('国家级非物质文化遗产 · 高甲戏　｜　'+stamp,W/2,H*.925);
      url=cv.toDataURL('image/png');
    }catch(e){ url=null; }
    if(url){
      $('#pImg').src=url;
      $('#pImg').style.display='block';
      $('#pSheet').style.display='none';
      $('#pTip').textContent='长按图片保存到相册';
    }
  };
  img.onerror=function(){};
  img.src='assets/stage.jpg';
}
$('#btnPoster').addEventListener('click',makePoster);
$('#pClose').addEventListener('click',function(){$('#poster').classList.remove('on')});
if(new URLSearchParams(location.search).get('poster')){
  setTimeout(function(){ makePoster(); },400);
}
$('#btnFinale').addEventListener('click',function(){if(finaleReady) goFinale()});

/* ================= 声音开关 ================= */
$('#btnSound').addEventListener('click',function(){
  state.muted=!state.muted;
  this.textContent=state.muted?'静':'音';
  this.classList.toggle('off',state.muted);
  if(!state.muted) clack();
});

/* ================= 初始化 ================= */
$('#rotDismiss').addEventListener('click',function(){
  document.documentElement.classList.add('rot-dismissed');
});
function hideLoader(){ var l=$('#loader'); if(l) l.classList.add('done'); }
window.addEventListener('load',function(){ setTimeout(hideLoader,300); });
setTimeout(hideLoader,9000);

if(TEST && QS.get('reset')==='1'){ try{ localStorage.removeItem('jyx_rec'); }catch(e){} }
if(TEST) $('#testBadge').classList.add('on');
if(QS.get('hot')==='1'){ document.documentElement.classList.add('dbghot'); }

if(QS.get('probe')==='1'){
  document.title='iw='+window.innerWidth+' ih='+window.innerHeight+' dpr='+window.devicePixelRatio+
    ' stage='+getComputedStyle(stage).transform+' rect='+JSON.stringify(stage.getBoundingClientRect().toJSON?stage.getBoundingClientRect().toJSON():{});
}
buildPeek(); buildPips($('#pipsPeek')); buildPips($('#pipsBack'));
buildStage(); refreshStageChips(); refreshPips();
startBreathe();
/* 不预加载立绘：回到最初版本的按需加载，首屏零额外流量。
   进入角色时按 src 加载、加载完再显示（防残留旧图），每个角色只下载一次。 */
setTimeout(function(){
  $('#peekArt').style.transform='scale(1.03)';
  setTimeout(function(){$('#peekArt').style.transform=''},1200);
},300);

/* 调试 */
var P=new URLSearchParams(location.search), q=P.get('s'), qg=P.get('game');
if(P.get('called')){
  document.documentElement.classList.add('noanim');
  ORDER.forEach(function(k){call(k)});
}
if(q){
  document.documentElement.classList.add('noanim');
  if(q==='stage'){
    show('scStage');
    if(P.get('seals')){
      ORDER.forEach(function(k){state.seals[k]=true;state.visited[k]=true});
      refreshStageChips(); maybeFinale();
    }
  }
  else if(q==='final'){ show('scFinal'); buildFinal(); confetti(); }
  else if(q==='lot'){
    state.seals.fox=true;state.seals.monkey=true;state.visited.fox=true;state.visited.monkey=true;
    openLot();
    var dn=P.get('draw');
    if(dn!==null){ setTimeout(function(){ present({d:todayKey(),i:parseInt(dn,10)||0,c:'8F3K-2M9'}); },300); }
    if(P.get('wall')){ setTimeout(function(){ $('#rWall').click();
      if(P.get('wall')==='pc') $$('.wptabs button')[1].click(); },700); }
    var pn=P.get('panel');
    if(pn){ setTimeout(function(){ openPanel(pn==='mine'?mineHtml():poolHtml()); },400); }
  }
  else if(q==='photo'){
    var ck0=P.get('c')||'fox';
    state.seals[ck0]=true; state.visited[ck0]=true; enterBack(ck0); setTimeout(function(){toPhoto(ck0)},60);
  }
  else if(CH[q]){ enterBack(q); }
}
if(qg){
  document.documentElement.classList.add('noanim');
  var ck=ORDER.filter(function(k){return CH[k].game===qg})[0];
  if(ck) setTimeout(function(){ enterBack(ck); setTimeout(startGame,80); },60);
}

window.__h5={enterBack:enterBack,show:show,state:state,startGame:startGame,toPhoto:toPhoto};
})();
</script>
</body>
